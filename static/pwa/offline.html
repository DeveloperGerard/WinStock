<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173D30">
  <title>Sin conexión | WinStock</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F6F7F3;color:#20352c;font-family:Arial,sans-serif;text-align:center}
    main{max-width:420px;padding:36px 28px;background:#fff;border-radius:18px;box-shadow:0 12px 35px #173d3015}
    .mark{width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:16px;background:#173D30;color:#fff;font-size:30px;font-weight:700}
    h1{margin:0 0 12px;font-size:24px}p{color:#64736b;line-height:1.6;margin:0 0 24px}
    button{border:0;border-radius:9px;padding:12px 20px;background:#173D30;color:white;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">W</div>
    <h1>No tienes conexión</h1>
    <p>WinStock necesita Internet para consultar y actualizar la información del predio. Comprueba tu conexión e inténtalo nuevamente.</p>
    <button onclick="window.location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
