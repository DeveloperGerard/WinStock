{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173D30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icon-192.png' %}">
  <title>Iniciar sesión · WinStock</title>
  <link rel="stylesheet" href="{% static 'forms/inifunc.css' %}?v=2">
</head>
<body>
  <main class="auth">
    <header><h1>WinStock<small>GESTIÓN DEL PREDIO</small></h1></header>

    <form method="post">
      {% csrf_token %}
      <h2>Iniciar sesión</h2>
      {{ form.non_field_errors }}
      {% for f in form %}
      <label>{{ f.label }}{{ f }}{% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}</label>
      {% endfor %}
      <button class="btn">Iniciar sesion</button>
    </form>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("{% url 'service_worker' %}")
          .catch((error) => console.error('No se pudo registrar el Service Worker:', error));
      });
    }
  </script>
</body>
</html>
