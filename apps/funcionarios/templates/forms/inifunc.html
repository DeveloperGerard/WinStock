{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · WinStock</title>
  <link rel="stylesheet" href="{% static 'forms/inifunc.css' %}?v=2">
</head>
<body>
  <main class="auth">
    <header><h1>WinStock<small>GESTIÓN DEL PREDIO</small></h1></header>

    <form method="post">
      {% csrf_token %}
      <h2>Iniciar sesión</h2>
      {{ form.non_field_errors }}
      {% for f in form %}
      <label>{{ f.label }}{{ f }}{% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}</label>
      {% endfor %}
      <button class="btn">Iniciar sesion</button>
    </form>
    <p class="auth-footer"><span>¿Aún no tienes cuenta?</span> <a class="auth-link" href="{% url 'funcionarios:registro' %}">Regístrate</a></p>
  </main>
</body>
</html>
