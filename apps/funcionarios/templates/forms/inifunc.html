{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173D30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icon-192.png' %}">
  <title>Iniciar sesión · WinStock</title>
  <link rel="stylesheet" href="{% static 'forms/inifunc.css' %}?v=2">
  <style>
    #login-offline-notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #ead18a;
      border-left: 5px solid #c58a16;
      border-radius: 12px;
      background: linear-gradient(110deg, #fff8df, #fffdf6);
      color: #493d12;
      box-shadow: 0 8px 24px #493d3010;
    }
    #login-offline-notice[hidden] { display: none !important; }
    .login-offline-icon {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f5e8bd;
      color: #80530a;
      font-weight: 800;
    }
    .login-offline-copy { display: grid; gap: 3px; line-height: 1.45; }
    .login-offline-copy span { color: #685a37; font-size: 12px; }
    body.modo-offline [data-solo-online] {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="auth">
    <header><h1>WinStock<small>GESTIÓN DEL PREDIO</small></h1></header>
    <div id="login-offline-notice" role="status" aria-live="polite" hidden>
      <span class="login-offline-icon" aria-hidden="true">!</span>
      <span class="login-offline-copy">
        <strong>Estás sin conexión</strong>
        <span>Para iniciar sesión necesitas internet. Vuelve a intentarlo cuando se restablezca la conexión.</span>
      </span>
    </div>

    <form id="login-form" method="post" data-solo-online>
      {% csrf_token %}
      <h2>Iniciar sesión</h2>
      {{ form.non_field_errors }}
      {% for f in form %}
      <label>{{ f.label }}{{ f }}{% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}</label>
      {% endfor %}
      <button class="btn" type="submit" data-solo-online>Iniciar sesion</button>
    </form>
  </main>
  <script>
    const loginForm = document.getElementById('login-form');
    const loginOfflineNotice = document.getElementById('login-offline-notice');
    const updateLoginConnectionState = () => {
      const offline = !navigator.onLine;
      document.body.classList.toggle('modo-offline', offline);
      loginOfflineNotice.hidden = !offline;
      loginForm.inert = offline;
      loginForm.querySelectorAll('button[data-solo-online]').forEach((button) => {
        button.disabled = offline;
        button.setAttribute('aria-disabled', String(offline));
      });
    };

    updateLoginConnectionState();
    window.addEventListener('online', updateLoginConnectionState);
    window.addEventListener('offline', updateLoginConnectionState);
    loginForm.addEventListener('submit', (event) => {
      if (!navigator.onLine) event.preventDefault();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("{% url 'service_worker' %}")
          .catch((error) => console.error('No se pudo registrar el Service Worker:', error));
      });
    }
  </script>
</body>
</html>
