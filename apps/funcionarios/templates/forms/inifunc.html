{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173D30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icon-192.png' %}">
  <title>Iniciar sesión · WinStock</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ws-green: #173D30;
      --bs-body-font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --bs-body-bg: #f5f6f2;
      --bs-body-color: #1f2f28;
    }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top, 0));
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0));
    }
    .auth-card { width: 100%; max-width: 420px; --bs-card-bg: #fff; border-color: #e4e7e1; border-radius: .9rem; overflow: hidden; box-shadow: 0 8px 30px rgba(23, 61, 48, .08); }
    .auth-head { background: var(--ws-green); color: #fff; padding: 1.5rem 1.75rem; }
    .auth-head .brand { font-size: 1.6rem; font-weight: 700; line-height: 1; margin: 0; }
    .btn-ws { --bs-btn-color: #fff; --bs-btn-bg: var(--ws-green); --bs-btn-border-color: var(--ws-green);
      --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #0f2a21; --bs-btn-hover-border-color: #0f2a21;
      --bs-btn-active-bg: #0f2a21; --bs-btn-active-border-color: #0f2a21; --bs-btn-focus-shadow-rgb: 23, 61, 48; }
    .form-control:focus { border-color: var(--ws-green); box-shadow: 0 0 0 .2rem rgba(23, 61, 48, .15); }
  </style>
</head>
<body>
  <main class="card auth-card">
    <header class="auth-head d-flex align-items-center gap-2">
      <p class="brand">WinStock</p>
    </header>

    <div class="card-body p-4">
      <h1 class="h3 fw-bold mb-1">Iniciar sesión</h1>
      <p class="text-secondary mb-4">Ingresa con tu RUT y contraseña.</p>

      <form method="post" id="login-form">
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2 small" role="alert">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for f in form %}
          <div class="mb-3 campo">
            <label for="{{ f.id_for_label }}" class="form-label fw-medium">{{ f.label }}</label>
            {{ f }}
            {% for e in f.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
          </div>
        {% endfor %}

        <button class="btn btn-ws btn-lg w-100 mt-2" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </main>

  <script>
    // Registro PWA: el Service Worker solo almacena recursos estáticos.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("{% url 'service_worker' %}")
          .catch((error) => console.error('No se pudo registrar el Service Worker:', error));
      });
    }

    (function () {
      const form = document.getElementById('login-form');
      if (!form) return;

      // Clases de Bootstrap para los campos que genera Django.
      form.querySelectorAll('input:not([type=hidden]):not([type=checkbox])').forEach((el) => {
        el.classList.add('form-control', 'form-control-lg');
      });
      form.querySelectorAll('.campo').forEach((campo) => {
        if (campo.querySelector('.invalid-feedback')) {
          campo.querySelectorAll('.form-control').forEach((c) => c.classList.add('is-invalid'));
        }
      });

      // Autocompletado correcto para gestores de contraseñas.
      const inputs = form.querySelectorAll('input.form-control');
      if (inputs[0]) { inputs[0].setAttribute('autocomplete', 'username'); inputs[0].focus(); }

      // Botón para mostrar u ocultar la contraseña.
      form.querySelectorAll('input[type=password]').forEach((input) => {
        input.setAttribute('autocomplete', 'current-password');

        const group = document.createElement('div');
        group.className = 'input-group has-validation';
        input.parentNode.insertBefore(group, input);
        group.appendChild(input);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-outline-secondary';
        btn.setAttribute('aria-label', 'Mostrar contraseña');
        btn.innerHTML = '<i class="bi bi-eye"></i>';
        group.appendChild(btn);

        btn.addEventListener('click', () => {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.firstElementChild.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
          btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      });
    })();
  </script>
</body>
</html>
